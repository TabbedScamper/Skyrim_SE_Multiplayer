<div class="container">
  <h2>Skyrim SE Multiplayer</h2>
  <app-action-buttons>
    <button [disabled]="connecting" (click)="hostSteamSession()" data-style-ornament="simple">
      Host Session
    </button>
  </app-action-buttons>
  <input
    type="text"
    placeholder="Steam lobby ID"
    [(ngModel)]="steamLobbyId"
    (keydown.enter)="joinSteamSession()"
    spellcheck="false"
  />
  <button [disabled]="connecting" (click)="joinSteamSession()" data-style-ornament="simple">
    Join Session
  </button>
  <hr />
  <div class="instructions">
    <p [innerHtml]="'COMPONENT.CONNECT.INFO.SERVER_ADDRESS' | transloco"></p>
    <p class="warning">
      {{ 'COMPONENT.CONNECT.INFO.HELGEN' | transloco }}
    </p>
  </div>

  <input
    #input
    type="text"
    [placeholder]="'COMPONENT.CONNECT.ADDRESS' | transloco"
    (keydown.enter)="connect()"
    [(ngModel)]="address"
    spellcheck="false"
  />
  <input
    [type]="hidePassword ? 'password' : 'text'"
    [placeholder]="'COMPONENT.CONNECT.PASSWORD' | transloco"
    spellcheck="false"
    [(ngModel)]="password"
    (keydown.enter)="connect()"
  />
  <div class="password-options">
    <span>
      <input type="checkbox" id="save-password" [(ngModel)]="savePassword" />
      <label for="save-password">{{
        'COMPONENT.CONNECT.SAVE_PASSWORD' | transloco
      }}</label>
    </span>
    <span>
      <input type="checkbox" id="hide-password" [(ngModel)]="hidePassword" />
      <label for="hide-password">{{
        'COMPONENT.CONNECT.HIDE_PASSWORD' | transloco
      }}</label>
    </span>
  </div>

  <app-action-buttons>
    <button
      [disabled]="connecting"
      (click)="connect()"
      data-style-ornament="simple"
    >
      {{ 'COMPONENT.CONNECT.CONNECT' | transloco }}
    </button>
    <button
      [disabled]="connecting"
      (click)="cancel()"
      data-style-ornament="simple"
    >
      {{ 'COMPONENT.CONNECT.CANCEL' | transloco }}
    </button>
  </app-action-buttons>
  <hr />
  <button (click)="openServerList()" data-style-ornament="simple">
    {{ 'COMPONENT.CONNECT.PUBLIC_SERVERS' | transloco }}
  </button>
</div>
